<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hdr">
      <div class="logo"><i class="fas fa-rocket"></i> Launchify</div>
      <div class="auth-btns">
        <button class="btn login">Log in</button>
        <button class="btn signup"> Sign up</button>
        </div>
    </header>
    <main class="cnt">
      <div class="bg-circle"></div>
      <div class="anim-bg">
        <div class="circle sm"></div>
        <div class="circle md"></div>
        <div class="circle lg"></div>
        <div class="circle xl"></div>
      </div>
      <h1>We are launching in</h1>
      <p class="subtext">Asocial batting network where you can follow tipsters,share,and copy bets our community & friends.
      </p>
      <div class="countdown">

        <div class="time-box">
          <span id="days">00</span>
          <span>Days</span>
        </div>
        <div class="time-box">
          <span id="hours">00</span>
          <span>Hours</span>
        </div>
        <div class="time-box">
          <span id="minutes">00</span>
          <span>Minutes</span>
        </div>
        <div class="time-box">
          <span id="seconds">00</span>
          <span>Seconds</span>
        </div>
      </div>
      <div class="subscribe">
        <input type="email" placeholder="Your Email..."/>
        <button class="btn sub-btn">Sign up</button>
      </div>
    </main>
    <canvas id="confetti-canvas"></canvas>
    <div class="popup hidden" id="popup">
      <h2>Launch Time</h2>
      <p>Thank you for waiting. We are Live!</p>
      <button class="btn close-btn" onclick="closePopup()">Close</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
